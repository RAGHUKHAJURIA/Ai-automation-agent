name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PHASE1_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/personal_agent_ci?replicaSet=rs0
      PHASE1_TEST_REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: docker compose -f infra/compose.dev.yml up -d --wait
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm infra:config
      - if: always()
        run: docker compose -f infra/compose.dev.yml down -v
