# Isolated test replica set when local MongoDB already occupies port 27017.
# Connect from the Windows host with replicaSet=rs0&directConnection=true on port 27018.
services:
  mongodb:
    image: mongo:8.0.32-noble
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (error) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"127.0.0.1:27017\" }] }).ok }' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
